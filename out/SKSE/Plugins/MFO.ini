; MFO seed defaults. MCM Helper's Data/MCM/Settings/MFO.ini is read AFTER this
; and wins. A key whose MEANING changes must be RENAMED, never redefined --
; MCM Helper persists by key name into MO2 overwrite and stale values survive
; mod updates (INVARIANTS #37).
[Detection]
bAllowSummons = 0

[Rapport]
fRapportRate = 2.0
fRapportKill = 1.0
fRapportBossMult = 5.0
fRapportDragonMult = 10.0
fSharedRadius = 3000.0
; Seconds after a follower was last SEEN fighting that they still count as
; having shared a kill. Killing the last enemy ends combat, so the fight is
; already over by the time a death is processed -- without this, a follower who
; fought the whole battle away from the player earns nothing.
fSharedCombatGrace = 15.0
; A kill counts as a boss if the actor is UNIQUE (named one-off) or is at
; least this many levels above you. IsUnique alone missed generic dungeon
; bosses -- a bandit chief has a boss bar but is not a unique actor.
iBossLevelDelta = 5
iRapportRank2 = 250
iRapportRank3 = 1000
iRapportRank4 = 2500
iRapportRank5 = 5000
; One HUD line when a follower's rapport RANK rises ("Lydia fights beside you
; with new resolve."). Rank changes are rare by design, so this cannot spam.
bRapportToasts = 1

[Progression]
; PROGRESSION ADDON (needs MFO_Progression.esl; sections are cosmetic to the
; parser). Shared Growth: 1 = benched enrolled followers level at the addon's
; divisor rate (half by default -- the roster-strategy price); 0 = everyone
; matches the player's level at full rate. A PLAYER setting (later an MCM
; Addons toggle); the economy numbers themselves live in the ESL for xEdit.
bSharedGrowth = 1

[UI]
; Passive top-right readout. Draws every frame, takes no input, so it stays
; usable while fighting. This is the primary observation surface.
bShowHud = 0

[Targeting]
; Installs a vfunc hook on Character::UpdateCombat so MFO can command WHICH foe
; a follower fights. OFF until measured. NOTE: turning this ON needs a restart
; (the hook installs once at load); turning it OFF works live.
bCommandTarget = 1

[Evaluator]
; Seeds "Self HP < 40% -> Cast Healing" + "Always -> Wait" onto each follower,
; so gambits are testable before the board exists. OFF for real play.
bSeedEvaluatorRules = 0
; Put the gambit spell in the follower's hand and let their OWN AI cast it --
; the only path that can animate. OFF by default: it moves real equipment.
bEquipToCast = 1
; Seconds to wait, after equipping, for their AI to cast before MFO does it
; silently instead. Zero destroys the very thing this is meant to measure.
fAiCastGrace = 3.0
; Minimum seconds between gambit casts for one follower. THE RATE LIMITER --
; a cast takes the spell out of their hand and this decides when it returns,
; because a follower can only cast what they are holding. Not a resource cap:
; a weak heal SHOULD be cast many times in a long fight.
; Probe: drive the caster state machine instead of applying the effect.
bDriveCaster = 0
; P1 PROBE, DEV-ONLY, DEFAULT OFF -- carries CTD risk; leave at 0 unless you
; are running the combat-style experiment. While a cast rule is latched, swap
; the follower's live per-combat style to MFO_CastStyle (caster-forward: high
; magic score, low melee) and restore on release, to measure whether his own
; AI casts more (and stays mobile). Watch "[probe cstyle]" in MFO.log.
; Needs a full game restart to arm. Not exposed in the MCM on purpose.
bProbeCastStyle = 0
; WEAPON-STANCE OWNERSHIP -- STANDARD FEATURE, DEFAULT ON. When an equip gambit
; wins a follower's hand, swap their live per-combat combat style to
; MFO_MeleeStyle / MFO_RangedStyle so the engine stops re-drawing the weapon MFO
; didn't pick (the bow<->mace ping-pong an archer's own AI causes). Reverts at
; battle end. This is a debug kill-switch only -- set to 0 to disable. Watch
; "[wstyle]" in MFO.log. Not in the MCM on purpose (it is expected behaviour).
bWeaponStyleControl = 1
; FRIENDLY-FIRE HOLD -- DEFAULT ON. Hold a follower's OFFENSIVE cast when one of
; your own teammates is in the AoE blast or on the caster->target line (the
; engine's line-of-sight passes through allies, so a mage would otherwise fire
; into a teammate's back in a hallway). Set to 0 to let followers fire freely.
; Watch "[consent] ... HARD-ABORTED cast of ... (friendly fire)" in MFO.log.
bFriendlyFireHold = 1
; QUASH ALLY COMBAT -- DEFAULT ON. Followers must never fight each other. If one
; follower aggros another (usually friendly fire), MFO ends that combat on both
; sides. Set to 0 to disable. Watch "[peace]" in MFO.log.
bQuashAllyCombat = 1
; SELF / AUTO CASTING -- DEFAULT ON (v1.0.65). Lets a follower cast a beneficial
; spell on himself and, via "Cast at foe/ally" set to Auto, on the whole party:
; self-buffs/lights (Candlelight), heals to injured allies, and hostile spells
; onto nearby enemies. Effect + magicka only, no animation (deferred). Set to 0
; to leave all casting to the follower's own AI. Watch "[cast] ... AUTO ..." and
; "[cast] ... SELF-CAST ..." in MFO.log.
bCastSelf = 1
fCastCooldown = 4.0
; AUTO fan-out: how eagerly a HOSTILE duration spell (a DoT/debuff) is re-cast on
; a foe it is already ticking on. MFO splits the spell into up-front BURST damage
; and per-second DOT, then recasts only when
;   burst >= dotRate * (DoT time remaining) * fDotRecastBurstRatio.
; 1.0 = recast once the burst outweighs the DoT still to be delivered; raise it to
; let the tail run longer, lower it to recast more eagerly. Pure-burst spells
; always fire; pure-DoT spells wait out their duration.
fDotRecastBurstRatio = 1.0
; AUTO fan-out: how a BENEFICIAL DURATION buff (Candlelight/Magelight and other
; lights, wards, fortifies) is kept from re-casting on a robotic, too-fast beat.
; A light applied hands-free never registers as "already active", so without this
; MFO respammed it every couple of seconds while magicka lasted. MFO now waits
; until the buff is near its own real expiry before re-casting:
;   window = (buff authored duration) * fBeneficialRecastFrac * (1 +/- jitter),
;   jitter uniform in [-fBeneficialRecastJitter, +fBeneficialRecastJitter].
; 0.85 re-casts at ~85% of the buff's life (a small safety margin so it never
; lapses); the +/-20% jitter makes each recast delay a little different so it
; looks human. INSTANT beneficial spells (instant heals) are exempt and re-fire
; on demand; concentration streams (Healing Hands) are exempt too. Watch
; "[cast] ... beneficial recast suppressed" in MFO.log.
fBeneficialRecastFrac = 0.85
fBeneficialRecastJitter = 0.20
; Fraction of magicka a gambit will not leave them below AFTER a cast. OFF by
; default on purpose -- a follower healing to stay alive is exactly who a floor
; gets killed.
fMagickaReserve = 0.0
; Probe only. DoCombatSpellApply is an instant SILENT apply, not an animated
; cast -- kept solely to measure whether it deducts magicka.
bCommandCast = 0
; Seconds a follower stays quiet after a real action fires.
fSuppressWindow = 1.5
; Which caster a gambit spell uses. 3 = kInstant applies the effect but plays
; NO animation (proven). 1 = right hand is the candidate for a visible cast.
; 0 = left hand, 2 = other. Use the Probe tab to find which animates.
; PROVEN 2026-07-21: NO source animates. Left at 3 (kInstant) because the
; hand sources buy nothing and kInstant is the honest name for what happens.
iCastSource = 3


[Debug]
; FOLLOWER-PROGRESSION SINKER PROBE -- DEV-ONLY, DEFAULT OFF, LOG-ONLY OUTPUT.
; Arms the throwaway probe for the progression ESL design (P1 perk-on-NPC /
; P2 base-AV survival / P3 reapply idempotency). When armed, pressing the probe
; key adds ONE real perk from the load order's own perk trees to your CURRENT
; follower's base (SPID pattern) and writes a known +10 OneHanded base-skill
; allocation to them. Everything is reported under "[prog]" in MFO.log.
; First press = full probe; later presses = status re-read (press again after
; levelling up); save+reload = the P3 reapply check runs by itself.
; Use a throwaway save: the perk/skill changes are real (though log-only in
; intent) and the skill write persists into saves taken afterwards.
bProgProbe = 0
; DIK code for the probe trigger key, in DECIMAL (the parser is base-10 only).
; 39 = DIK 0x27 = semicolon, unbound in vanilla. 0 disables the trigger.
iProgProbeKey = 39
; PROGRESSION CATALOG DUMP -- DEV-ONLY, DEFAULT OFF, READ-ONLY. Forces the
; production catalog reader (progression addon component 1) to build at load
; even without MFO_Progression.esl, and dumps the full [prog] census to MFO.log:
; per skill tree, kept/marginal/filtered perk counts, every filtered perk with
; the reason it was filtered, and spot-check nodes (grid/dome coords + skill-req
; strings). Mutates nothing -- no perk, no skill, no save. Needs a restart.
bProgCatalogDump = 0
; PROGRESSION ALLOCATOR DEV HARNESS (addon component 2) -- DEV-ONLY, DEFAULT
; OFF. Needs MFO_Progression.esl enabled (the allocator is inert without it).
; When armed, the harness key runs ONE allocator verb on your current follower;
; pick the verb from the console first:  set MFOP_DevCmd to N
;   0=status  1=enroll  2=cycle class (Melee/Ranged/Mage)  3=dump auto-scaled
;   skills  4=allocate next eligible perk (full gating)  5=respec (-500 rapport)
;   6=economy dump.  Everything reports under "[prog]" in MFO.log.
; Use a throwaway save: enrollment/class/perk state serializes into the co-save
; and the perk/skill writes on the follower are real.
bProgHarness = 0
; DIK code for the harness trigger key, in DECIMAL (the parser is base-10 only).
; 40 = DIK 0x28 = apostrophe, unbound in vanilla. 0 disables the trigger.
iProgHarnessKey = 40
bEnableLogging = 1
bProfileRapport = 0
bProfileEvaluator = 0
; Writes synthetic gambits onto a player-keyed record. Only meaningful if you
; intend to SAVE with the mod active. Off = MFO leaves nothing behind at all.
bSeedTestData = 0

; The influence actuator: remove the AI's veto on casting a gambit spell so the
; follower casts it themselves, mobile. Installs a vfunc hook.
bCasterHook = 1
; 0 = log only (observe the AI's answer), 1 = force (override a veto).
iCasterMode = 1
; HYBRID FORCED CAST (v1.0.27): if the follower's own AI casts a DIFFERENT
; spell (or nothing) during the grace window, force the gambit's configured
; spell through the cast package at the chosen target -- line of sight
; required for the forced shot. 0 = old behaviour (AI decides, silent fallback).
bForceCastOnMiss = 1
; The package-actuation machinery the forced cast rides (MFO_CommandQuest
; alias 0 + MFO_CastPackage). ON since v1.0.27; release is by marker eviction
; with a load sweep, so a mid-cast save self-heals.
bUsePackages = 1
; ── Logistics (M6): a non-combat rule table -- drink potions, loot arrows/
; potions/gear. OFF by default; reviewed but young.
bLogistics = 1
; Seconds a follower waits before looting an item, giving the player first dibs.
fFirstDibsDelay = 4.0
; Collapsed delay once the player has looted from that source (QuickLoot). Never 0.
fQuickLootWaiver = 4.0
; ── Claim-and-Release loot priority (dibs). The follower may take a value-tier
; from a source only once the PLAYER's claim on it releases -- by evidence about
; the player, not a wall clock. fFirstDibsDelay above = the Gear anti-snatch
; grace; fQuickLootWaiver = the post-take Rejection linger.
fChanceRadius = 512.0        ; player "had a chance" within this of the source
fFairChance = 6.0            ; seconds near + facing/considering before Valuables release
fAbandonDelay = 45.0         ; player never came near -> Valuables release after this
fDepartRadius = 700.0        ; player took, then left this far -> "moved on"
fPlayerBubble = 256.0        ; convergence yield: never walk to loot within this of you
; How far (game units) a follower scans for loot. ~70 units = 1m; a cell = 4096.
; 3000 ~= 4-5 rooms. Candidates must also be within the confidence leash of you.
fLootRadius = 3000.0
; OPTION A: follower WALKS to loot instead of teleport-grabbing. On by default
; (reworked in v0.8.2 -- native release + walkable radius). Set 0 to disable.
bLootTravel = 1
; Loot inside PLAYER HOMES. 0 (default) = never loot in your own house (any cell
; flagged LocTypePlayerHouse); 1 = loot there too. Drinking/supply is unaffected.
bLootInPlayerHomes = 0
; Follower economy: 1 (default) = sell junk + buy supplies at merchants; 0 = dry-run log only.
bEconomy = 1
; Economy sub-toggles (both gated under bEconomy). 1 (default) each.
; bEconomyBuyGear: buy ONE best-affordable weapon/armor/mage-apparel upgrade per
; visit, only when it costs <= 50% of the follower's purse (keeps a reserve).
bEconomyBuyGear = 1
; bEconomyBuyTomes: a MAGE follower (has a cast gambit) buys spell tomes for its
; top-2 magic schools it does not know yet, then studies them. Auto-learning a
; tome you HAND a mage is independent of this toggle; this only gates buying.
bEconomyBuyTomes = 1
; CLASS HMS ON LEVEL-UP (v1.0.68). bHmsRedistribute: 1 (default) = each level a
; follower's Health/Magicka/Stamina gain is reshaped to its class profile (mage
; -> Magicka, archer -> Stamina, warrior -> Health); total gain == vanilla, only
; the split changes. 0 = vanilla per-level HMS stands untouched.
bHmsRedistribute = 1
; fHmsSkewMax: skew ceiling as a PERCENT of each level's HMS budget that may be
; pulled from the class-primary pool toward an off-class pool the follower
; actually exercises in battle (a battle-mage earning some Magicka). 0 disables.
fHmsSkewMax = 20.0
; MAGE DRESS-UP (loot + buy). bMageWearRobes: 1 (default) = a caster wears mage
; clothing/jewelry; 0 = a caster picks/buys real ARMOR by rating like any class.
bMageWearRobes = 1
; bMageApparelStrictSchool: 0 (default) = value-driven (wear the most expensive
; piece); 1 = an ENCHANTED apparel piece must fortify one of the follower's top-2
; magic schools (plain clothing/jewelry unaffected, so no slot is left bare).
bMageApparelStrictSchool = 0
; MEO AWARE FOLLOWERS (needs MEO). bMeoAwareGems: 0 (default) = followers still
; CONSERVE gems (a gem pulled off gemmed junk before selling is re-socketed into
; their own worn gear, never left loose -- always on with MEO); 1 = followers also
; OPTIMIZE, choosing the best gem per empty socket and swapping up to stronger gems.
bMeoAwareGems = 0
; SELL PRICING + MERCHANT-PERK BYPASS (advanced; INI-only, no MCM). Gated under bEconomy.
; bSpeechPricing: 1 (default) = a follower's SELL value follows the vanilla barter curve
; scaled by their Speech skill (~0.30 of value at Speech 0, ~0.50 at Speech 100); 0 = full value.
bSpeechPricing = 1
; bMerchantPerkBypass: 1 (default) = a follower holding the merchant perk (xMerchantPerkID) may
; SELL items outside the vendor's normal buy filter, like the player; 0 = vendor filter only.
bMerchantPerkBypass = 1
; xMerchantPerkID: the "sell anything" perk FormID (hex ok). 0x00058F7A = vanilla Merchant
; (this modlist's Ordinator "Salesman"). Change if your perk overhaul uses a different perk.
xMerchantPerkID = 0x00058F7A
; AUTO-RETREAT: 1 (default) = a badly-outmatched follower (low confidence)
; far from you in combat falls back to your side. Fires once per fight; the follower
; stops gambitting while falling back. The confidence leash taken to its conclusion.
; Anniversary Edition only (like walk-to-loot); no-op on Special Edition 1.5.97.
bAutoRetreat = 1
; MAGIC LOADOUT: 1 (default) = a follower with cast gambits (a magic user) loots
; school-appropriate enchanted apparel -- robes/hoods/gloves/boots boosting his
; most-cast school beat raw armor rating on those slots (school match first, then
; fanciness: gold value + fortify strength) -- and keeps ONE one-handed melee
; backup for when his magicka runs out. 0 = the old rating-only looting.
bMagicLoadout = 1
; 1 (default) = the mage backup is DAGGERS only (a caster's sidearm). 0 = the
; best of any one-handed weapon.
bMageDaggersOnly = 1
; BEAST-RACE HEAD FIX: 1 (default) = after equipping looted gear on a beast-race
; follower (Khajiit/Argonian, incl. custom ones like Inigo), force a 3D rebuild so
; their HEAD reattaches -- beast heads go invisible on a scripted equip otherwise.
; Beast-gated (human followers are untouched). 0 = disable (e.g. if the 1-frame
; rebuild is visually distracting). Watch "[beasthead]" in MFO.log.
bBeastHeadFix = 1
; LOW-POWER POTION FLOOR: a restore potion below this magnitude is ignored entirely;
; the rest are looted strongest-first. 0 = AUTO (use the load order's weakest restore
; tier, logged as [potfloor] at startup). A positive value is an explicit floor across
; all restore types. Fortify/cure potions are never filtered.
iMinPotionMag = 0
; HARD CEILING on walk-to-loot distance. The real limit is the confidence leash
; (walkLimit = min(leash, this)); lower this only to clamp BELOW the leash.
fTravelRadius = 4096.0
; BATCH EXCURSION: a follower stays out and loots multiple corpses in one trip
; (retargeting closest-first) instead of returning to you after each one.
; fBatchLinger: when loot is nearby but still under YOUR dibs, wait this long
; (re-scanning) before giving up and returning. 0 = never wait (exhaust & return).
fBatchLinger = 4.0
; fExcursionMax: whole-excursion hard cap (seconds) -- he returns after this no
; matter what, so a batch can't run away. The leash still bounds how far he roams.
fExcursionMax = 60.0
; NAVMESH GATE (units): before walking to loot, MFO checks the nearest navmesh
; point to the body; farther than this = off the navmesh (unreachable) -> skip it
; before he freezes. ~300. Raise if reachable bodies get skipped, lower if he
; still walks to unreachable ones. 0 disables the gate.
fNavmeshGate = 300.0
; The confidence leash: how far from YOU a follower will range, scaled by how
; safe they feel (health/resources, less in a fight). Min ~= one room (scared),
; max several rooms (confident). Units: ~70/m, cell 4096.
fLeashMin = 512.0
fLeashMax = 4000.0
