name: native

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:
    inputs:
      # PROOF BUILD for tools/splitcheck (CLAUDE.md "SOURCE FILE SIZE AND SPLITS"):
      # the same Release build with inline expansion OFF (/O2 /Ob0), so a TU split
      # cannot change which helpers the compiler inlines, and `splitcheck --strict`
      # can demand byte identity. NEVER shipped: the release DLL is always the
      # normal /O2 build (a push run, or a dispatch with noinline=false).
      noinline:
        description: "Proof build: compile with /O2 /Ob0 (inlining off). Not a shippable DLL."
        type: boolean
        default: false
      # /Ob0 alone is not enough for byte identity: without inlining MSVC still
      # optimizes ACROSS the functions of one TU (a caller's register allocation
      # uses what it knows of a same-TU callee), so moving a function to another
      # TU still changes its callers' registers. /Od turns the optimizer off, so
      # each function compiles from its own source alone. (Measured 2026-09-24.)
      noopt:
        description: "Proof build: compile with /Od (optimizer off, so no inlining). Not a shippable DLL."
        type: boolean
        default: false
      source_ref:
        description: "Build this commit instead of the dispatched ref (e.g. main's SHA as the proof baseline)."
        type: string
        default: ""

# A newer push supersedes an in-flight build. Without this, several ~30 min
# cold builds run in parallel racing to populate the same cache, and none of
# them wins. A manual dispatch gets a group of its own, so proof builds of two
# commits can run side by side without cancelling each other.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('native-dispatch-{0}', github.run_id) || format('native-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: ilammy/msvc-dev-cmd@v1

      # SPLIT restore/save ON PURPOSE. The combined actions/cache action only
      # saves in its post-step when the job SUCCEEDS -- so with a plain cache
      # step, every compile error throws away the vcpkg build and the next run
      # pays the full ~30 min cold cost again. Early development is mostly
      # failed builds, so that is exactly backwards: the cache matters MOST
      # when the build is broken.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Configure
        if: ${{ inputs.noinline != true && inputs.noopt != true }}
        run: cmake --preset release
        env:
          VCPKG_ROOT: C:\vcpkg

      # Only MFO's own sources get /Ob0: the vcpkg ports are built by vcpkg with
      # their own triplet flags, so the dependency cache is shared with the
      # normal build.
      - name: Configure (proof build, inlining off)
        if: ${{ inputs.noinline == true && inputs.noopt != true }}
        run: cmake --preset release "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob0 /DNDEBUG"
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Configure (proof build, optimizer off)
        if: ${{ inputs.noopt == true }}
        run: cmake --preset release "-DCMAKE_CXX_FLAGS_RELEASE=/Od /DNDEBUG"
        env:
          VCPKG_ROOT: C:\vcpkg

      # Immediately after Configure (which is what actually builds the vcpkg
      # dependencies) and BEFORE the compile that might fail. if: always() so a
      # cancelled or failing job still banks the expensive artifacts.
      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}

      - name: Build
        run: cmake --build build/release

      # PROVENANCE (splitcheck --proof refuses unpaired builds): EVERY run records
      # the commit it actually compiled (differs from the run's headSha when
      # source_ref is set) and the optimizer flags, as its OWN artifact
      # (MFO-build-info), never inside MFO-dll -- that zip is unzipped straight
      # over the mod folder and stays exactly MFO.dll + MFO.pdb.
      - name: Record the built commit
        run: |
          git rev-parse HEAD
          New-Item -ItemType Directory -Force -Path build/buildinfo | Out-Null
          $dll = (Get-FileHash -Algorithm SHA256 build/release/MFO.dll).Hash.ToLower()
          "built=$(git rev-parse HEAD) noinline=${{ inputs.noinline == true }} noopt=${{ inputs.noopt == true }} dll_sha256=$dll" | Out-File -FilePath build/buildinfo/build-info.txt -Encoding ascii

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MFO-dll
          path: |
            native/build/release/MFO.dll
            native/build/release/MFO.pdb
          if-no-files-found: error

      # AFTER the DLL: an artifact-service failure on this small record must
      # never cost the release's MFO-dll upload.
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: MFO-build-info
          path: native/build/buildinfo/build-info.txt
          if-no-files-found: error
